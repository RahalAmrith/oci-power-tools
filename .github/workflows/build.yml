# Pipeline 1: build the executable for Windows, Linux (Ubuntu and Oracle Linux) and macOS,
# and smoke test each one.
#
# Runs on pushes to main, on pull requests, by hand from the Actions tab, and is reused by
# release.yml. Each operating system is built on its own runner, because PyInstaller cannot
# build for another OS.
#
# A Linux binary only runs on systems with the same or a newer glibc than the one it was built
# on. Ubuntu 22.04 (glibc 2.35) is too new for Oracle Linux 8 and 9, so the Oracle Linux build
# runs inside an oraclelinux:8 container (glibc 2.28). That binary also runs on Oracle Linux 9.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Only the Oracle Linux entry sets a container, the others run directly on the runner
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest Ubuntu available so the binary runs on older distributions
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-22.04
            target: oraclelinux8-x64
            container: oraclelinux:8
            oracle: true
          # Apple Silicon. macos-14 was retired by GitHub on 2 November 2026
          - os: macos-15
            target: macos-arm64
          - os: windows-latest
            target: windows-x64

    steps:
      # The container is a bare image, so Python and the build tools come from Oracle's repository
      - name: Prepare Oracle Linux
        if: matrix.oracle
        run: |
          dnf install -y python3.12 python3.12-pip python3.12-tkinter binutils git tar gzip
          python3.12 -m venv /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ !matrix.oracle }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      # easygui (the config file picker) needs the Tk libraries on Linux
      - name: Install Tk libraries (Linux)
        if: runner.os == 'Linux' && !matrix.oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build the executable
        run: python -m PyInstaller --onefile --name oci-power-tools --noconfirm --clean main.py

      - name: Smoke test the executable
        run: python .github/scripts/smoke_test.py dist/oci-power-tools${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Package
        run: python .github/scripts/package.py dist/oci-power-tools${{ runner.os == 'Windows' && '.exe' || '' }} oci-power-tools-${{ matrix.target }}

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: oci-power-tools-${{ matrix.target }}
          path: oci-power-tools-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14
