# Pipeline 2: publish a GitHub Release with the Windows, Linux and macOS downloads.
#
# Starts when you push a version tag such as v1.0.0. It runs the Build pipeline first, and
# only publishes if all three builds and their smoke tests pass.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: oci-power-tools-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum oci-power-tools-* > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
